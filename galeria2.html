<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Moderna HTML5</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mi Galería de Fotos</h1>
  </header>

  <main class="galeria-grid">
    <div class="foto-item">
      <img src="img/foto1.webp" alt="Descripción de la foto 1" loading="lazy">
      <div class="overlay"><span>Título de la obra</span></div>
    </div>
    <div class="foto-item">
      <img src="img/foto2.webp" alt="Descripción de la foto 2" loading="lazy">
      <div class="overlay"><span>Título de la obra</span></div>
    </div>
    <div class="foto-item">
      <img src="img/foto3.webp" alt="Descripción de la foto 3" loading="lazy">
      <div class="overlay"><span>Título de la obra</span></div>
    </div>
  </main>
</body>
</html>
