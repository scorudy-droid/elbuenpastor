<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel Elegante Pantalla Completa</title>
    <style>
        /* Eliminar márgenes por defecto del navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden; /* Evita barras de desplazamiento */
            background-color: #000; /* Fondo negro para transiciones más elegantes */
        }

        /* Contenedor principal que ocupa toda la pantalla */
        .carrusel-completo {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Estilo para las imágenes */
        .carrusel-completo img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Clave: ajusta la imagen sin deformarla */
            object-position: center; /* Centra la imagen al recortar en pantallas móviles */
            opacity: 0;
            animation: fadeElegante 25s linear infinite;
        }

        /* Tiempos de retraso para las 5 imágenes (Total: 25 segundos) */
        .carrusel-completo img:nth-child(1) { animation-delay: 0s; }
        .carrusel-completo img:nth-child(2) { animation-delay: 5s; }
        .carrusel-completo img:nth-child(3) { animation-delay: 10s; }
        .carrusel-completo img:nth-child(4) { animation-delay: 15s; }
        .carrusel-completo img:nth-child(5) { animation-delay: 20s; }

        /* Animación de desvanecimiento suave */
        @keyframes fadeElegante {
            0% { opacity: 0; }
            4% { opacity: 1; }  /* Aparece */
            20% { opacity: 1; } /* Se mantiene fija */
            24% { opacity: 0; } /* Desaparece */
            100% { opacity: 0; }
        }

        /* Capa oscura opcional encima para dar un toque cinematográfico y mejorar contraste */
        .filtro-oscuro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2); /* Oscurece un 20% la pantalla */
            z-index: 2; /* Se coloca por encima de las imágenes */
            pointer-events: none; /* Permite hacer clic a través de ella si es necesario */
        }
    </style>
</head>
<body>

    <div class="carrusel-completo">
        <!-- Filtro opcional para mejorar la estética -->
        <div class="filtro-oscuro"></div>

        <!-- Reemplaza los enlaces por tus imágenes reales -->
        <img src="img3.jpg" alt="Imagen 1">
        <img src="img4.jpg" alt="Imagen 2">
        <img src="img5.jpg" alt="Imagen 3">
        <img src="img6.jpg" alt="Imagen 4">
        <img src="img7.jpg" alt="Imagen 5">
    </div>

</body>
</html>
